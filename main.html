<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Font Lab has moved to index.html</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="index.html" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           font: 16px/1.6 system-ui, sans-serif; color: #10141a; background: #f2f5f8; }
    @media (prefers-color-scheme: dark) { body { color: #e9ecf1; background: #0d1014; } }
    main { max-width: 46ch; text-align: center; }
    a { color: #4c63e6; }
    @media (prefers-color-scheme: dark) { a { color: #8da2ff; } }
  </style>
</head>
<body>
  <main>
    <h1>Font Lab moved</h1>
    <p>The app now lives in <a id="go" href="index.html">index.html</a>, so it works as the default
      document when the folder is served. Any share link you had still works: its <code>#type=…</code>
      fragment is carried across.</p>
  </main>
  <script>
    /* Preserve any #type=… share fragment when forwarding. */
    var target = 'index.html' + (location.hash || '');
    document.getElementById('go').setAttribute('href', target);
    location.replace(target);
  </script>
</body>
</html>
